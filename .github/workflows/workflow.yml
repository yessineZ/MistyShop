name : Test Workflow

on :
    push :
        branches :
        - main

jobs :
    build-and-push :
        runs-on : ubuntu-latest
        steps :
        - name : clone repo to runner 
          uses : actions/checkout@v4


        - name : ls  
          run : ls -l


        - name : build frontend image 
          run : docker build -t linkedin-frontend ./frontend
        
        - name : build backend image
          run : docker build -t linkedin-backend ./backend

        - name : login to docker hub
          uses : docker/login-action@v1
          with :
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        
        #create a tag for the frontend image and the backend image
        - name : tag and push frontend image
          run : docker tag linkedin-frontend ${{secrets.DOCKER_USERNAME}}/linkedin-frontend
        
        - name : tag and push backend image
          run : docker tag linkedin-backend ${{secrets.DOCKER_USERNAME}}/linkedin-backend
 

        #push the frontend and backend images to docker hub
        - name : push frontend image to docker hub
          run : docker push ${{secrets.DOCKER_USERNAME}}/linkedin-frontend

        - name : push backend image to docker hub
          run : docker push ${{secrets.DOCKER_USERNAME}}/linkedin-backend

      

          