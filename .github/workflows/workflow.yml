name: Test Workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo to runner
        uses: actions/checkout@v4

      - name: List files in repo
        run: ls -l

      - name: Build frontend image
        run: docker build -t linkedin-frontend ./frontend

      - name: Build backend image
        run: docker build -t linkedin-backend ./backend

      - name: Check if DOCKER_USERNAME is set
      
        run: |
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
          echo "ERROR: DOCKER_USERNAME is not set!"
          exit 1
          else
          echo "DOCKER_USERNAME is set."
          fi


      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Create tags for the frontend and backend images
      - name: Tag frontend image
        run: docker tag linkedin-frontend:latest ${{ secrets.DOCKER_USERNAME }}/linkedin-frontend:latest

      - name: Tag backend image
        run: docker tag linkedin-backend:latest ${{ secrets.DOCKER_USERNAME }}/linkedin-backend:latest

      # Push images to Docker Hub
      - name: Push frontend image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/linkedin-frontend:latest

      - name: Push backend image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/linkedin-backend:latest
